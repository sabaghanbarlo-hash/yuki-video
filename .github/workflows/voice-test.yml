name: Voice test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/mono-official-stable.list
          for i in 1 2 3; do
            sudo apt-get update -y -o Acquire::Retries=3 || true
            sudo apt-get install -y ffmpeg espeak-ng && break
            sleep 10
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro
        run: |
          pip install numpy soundfile pillow
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" "kokoro>=0.9.4"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1
      - name: Read the test lines flat and expressive
        run: python -u tools/voice_test.py results
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add results/voice-test*
          git commit -m "Voice test samples [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push
