name: Generate video
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file in stories/ (e.g. stories/my-video.txt)"
        required: true
      voice:
        description: "Edge voice (placeholder until your own voice is added)"
        default: "en-US-AriaNeural"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install pillow numpy edge-tts
      - run: python generate.py "${{ inputs.script }}" --voice "${{ inputs.voice }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/*
