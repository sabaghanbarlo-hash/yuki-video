name: Make video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file, e.g. scripts/my-video.txt"
        default: "scripts/sample.txt"
      style:
        description: "Look: auto (the director picks per scene), flat, voxel, toon or collage (Yuki in a corner + a picture every few seconds)"
        default: "auto"
      media:
        description: "Collage pictures: auto (my media/ files, then AI pictures, then free stock photos, then drawn), ai, stock, local (media/ only) or drawn (default: only the lab's own animation, no pictures)"
        default: "drawn"
      seed:
        description: "Change this number to get a different arrangement of the same script"
        default: "0"
      energy:
        description: "Narrator delivery: 0.7 calm, 1.2 lively, 1.6 over the top"
        default: "1.2"
      voice:
        description: "voicestudio (Voice Studio, speaks in YOUR voice sample, slow), gemini (natural, emotional Gemini voice, not your voice; falls back to kokoro), kokoro (free voice matched to yours), clone (your own voice, slow), edge (Microsoft voices, often blocked)"
        default: "voicestudio"
      audio:
        description: "Optional: your own narration recording in the repo, e.g. audio/my-video.mp3 (replaces the voice above)"
        default: ""
      upload:
        description: "Upload to the YouTube channel? (true/false)"
        default: "false"
      privacy:
        description: "YouTube visibility: private, unlisted or public"
        default: "private"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SCRIPT: ${{ github.event.inputs.script }}
      STYLE: ${{ github.event.inputs.style }}
      MEDIA: ${{ github.event.inputs.media }}
      SEED: ${{ github.event.inputs.seed }}
      AUDIO: ${{ github.event.inputs.audio }}
      VOICE: ${{ github.event.inputs.voice }}
      ENERGY: ${{ github.event.inputs.energy }}
      UPLOAD: ${{ github.event.inputs.upload }}
      PRIVACY: ${{ github.event.inputs.privacy }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YUKI_GEMINI_VOICE: ${{ vars.YUKI_GEMINI_VOICE }}
      YUKI_GEMINI_TTS_MODEL: ${{ vars.YUKI_GEMINI_TTS_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          [[ "$SCRIPT" =~ ^scripts/[A-Za-z0-9._-]+\.txt$ ]] || { echo "::error::script must look like scripts/name.txt"; exit 1; }
          [[ "$STYLE" == "auto" || "$STYLE" == "flat" || "$STYLE" == "voxel" || "$STYLE" == "toon" || "$STYLE" == "collage" ]] || { echo "::error::style must be auto, flat, voxel, toon or collage"; exit 1; }
          [[ "$MEDIA" == "auto" || "$MEDIA" == "ai" || "$MEDIA" == "stock" || "$MEDIA" == "local" || "$MEDIA" == "drawn" ]] || MEDIA=drawn
          echo "MEDIA=$MEDIA" >> "$GITHUB_ENV"
          [[ "$SEED" =~ ^[0-9]{1,6}$ ]] || SEED=0
          echo "SEED=$SEED" >> "$GITHUB_ENV"
          [[ "$VOICE" == "gemini" || "$VOICE" == "voicestudio" || "$VOICE" == "kokoro" || "$VOICE" == "clone" || "$VOICE" == "edge" ]] || { echo "::error::voice must be gemini, voicestudio, kokoro, clone or edge"; exit 1; }
          [[ "$ENERGY" =~ ^[0-2](\.[0-9]+)?$ ]] || ENERGY=1.2
          echo "ENERGY=$ENERGY" >> "$GITHUB_ENV"
          [[ "$PRIVACY" == "private" || "$PRIVACY" == "unlisted" || "$PRIVACY" == "public" ]] || { echo "::error::bad privacy"; exit 1; }
          test -f "$SCRIPT" || { echo "::error::$SCRIPT not found"; exit 1; }
          if [ -n "$AUDIO" ]; then
            [[ "$AUDIO" =~ ^audio/[A-Za-z0-9._-]+$ ]] || { echo "::error::audio must look like audio/name.mp3"; exit 1; }
            test -f "$AUDIO" || { echo "::error::$AUDIO not found"; exit 1; }
          fi
          if [ "$VOICE" = "clone" ] && [ -z "$AUDIO" ]; then ls voice/ref.* >/dev/null 2>&1 || { echo "::error::No voice sample. Add voice/ref.m4a (or .wav/.mp3), 10-30 seconds of your clean voice, or pick another voice."; exit 1; }; fi

      - name: System dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/mono-official-stable.list
          for i in 1 2 3; do
            sudo apt-get update -y -o Acquire::Retries=3 || true
            sudo apt-get install -y ffmpeg espeak-ng && break
            echo "apt attempt $i failed, retrying..."; sleep 10
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install the Kokoro voice (the voice itself, or the fallback when Gemini is busy)
        if: ${{ (github.event.inputs.voice == 'kokoro' || github.event.inputs.voice == 'gemini') && github.event.inputs.audio == '' }}
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" "kokoro>=0.9.4" soundfile

      - name: Cache Kokoro model files
        if: ${{ (github.event.inputs.voice == 'kokoro' || github.event.inputs.voice == 'gemini') && github.event.inputs.audio == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1

      - name: Cache finished Gemini sentences (a re-run after the free quota resets only fetches the missing ones)
        if: ${{ github.event.inputs.voice == 'gemini' && github.event.inputs.audio == '' }}
        uses: actions/cache@v4
        with:
          path: .work
          key: gemini-sentences-${{ github.run_id }}
          restore-keys: gemini-sentences-

      - name: Install Voice Studio (voicestudio only)
        if: ${{ github.event.inputs.voice == 'voicestudio' && github.event.inputs.audio == '' }}
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.10.0" accelerate pydub soundfile numpy
          pip install --no-deps "git+https://github.com/debpalash/VoiceStudio.git"
          python -c "import omnivoice; from omnivoice import OmniVoice; print('Voice Studio engine ok')"

      - name: Cache Voice Studio model files
        if: ${{ github.event.inputs.voice == 'voicestudio' && github.event.inputs.audio == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voicestudio-v1

      - name: Cache finished sentences (voicestudio)
        if: ${{ github.event.inputs.voice == 'voicestudio' && github.event.inputs.audio == '' }}
        uses: actions/cache@v4
        with:
          path: .work
          key: vs-sentences-${{ github.run_id }}
          restore-keys: vs-sentences-

      - name: Install the voice-cloning model (clone only)
        if: ${{ github.event.inputs.voice == 'clone' && github.event.inputs.audio == '' }}
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts

      - name: Cache voice model files
        if: ${{ github.event.inputs.voice == 'clone' && github.event.inputs.audio == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1

      - name: Cache finished sentences (so a re-run does not start over)
        if: ${{ github.event.inputs.voice == 'clone' && github.event.inputs.audio == '' }}
        uses: actions/cache@v4
        with:
          path: .work
          key: clone-sentences-${{ github.run_id }}
          restore-keys: clone-sentences-

      - name: Render
        run: |
          mkdir -p output
          name=$(basename "${SCRIPT%.txt}")
          STYLE_ARG=""; [ "$STYLE" != "auto" ] && STYLE_ARG="--style $STYLE"
          STYLE_ARG="$STYLE_ARG --media ${MEDIA:-drawn}"
          if [ -n "$AUDIO" ]; then
            python -u generate.py "$SCRIPT" --audio "$AUDIO" --seed "$SEED" $STYLE_ARG --out "output/$name.mp4"
          elif [ "$VOICE" = "voicestudio" ]; then
            REF=""; if ls voice/ref.* >/dev/null 2>&1; then src=$(ls voice/ref.* | grep -v '\.txt$' | head -1); ffmpeg -y -v error -i "$src" -t 20 -ar 24000 -ac 1 "$RUNNER_TEMP/ref.wav"; REF="--ref $RUNNER_TEMP/ref.wav"; fi
            python -u generate.py "$SCRIPT" --tts voicestudio $REF --seed "$SEED" $STYLE_ARG --out "output/$name.mp4"
          elif [ "$VOICE" = "clone" ]; then
            src=$(ls voice/ref.* | head -1)
            ffmpeg -y -v error -i "$src" -t 30 -ar 24000 -ac 1 "$RUNNER_TEMP/ref.wav"
            python -u generate.py "$SCRIPT" --tts clone --ref "$RUNNER_TEMP/ref.wav" --energy "$ENERGY" --seed "$SEED" $STYLE_ARG --out "output/$name.mp4"
          else
            python -u generate.py "$SCRIPT" --tts "$VOICE" --energy "$ENERGY" --seed "$SEED" $STYLE_ARG --out "output/$name.mp4"
          fi
          ls -la output

      - name: Make the thumbnail
        continue-on-error: true
        run: |
          name=$(basename "${SCRIPT%.txt}")
          STYLE_ARG=""; [ "$STYLE" != "auto" ] && STYLE_ARG="--style $STYLE"
          python -u make_thumbnail.py "$SCRIPT" --seed "$SEED" $STYLE_ARG --out "output/$name.jpg"

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output/*.mp4
            output/*.plan.json
            output/*.jpg
            output/*.credits.txt

      - name: Upload to YouTube
        if: ${{ github.event.inputs.upload == 'true' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          name=$(basename "${SCRIPT%.txt}")
          mkdir -p results
          THUMBNAIL="output/$name.jpg" RESULT_JSON="results/$name.json" python -u publish_youtube.py "output/$name.mp4" "$SCRIPT"

      - name: Save the result link
        if: ${{ github.event.inputs.upload == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "Video published [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
