name: Make video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file, e.g. stories/my-video.txt"
        default: "stories/sample.txt"
      mode:
        description: "explainer (self-improvement, explaining) or story (storytelling with a cast and sound effects)"
        default: "explainer"
      energy:
        description: "Storyteller delivery: 0.7 calm, 1.2 lively, 1.6 over the top"
        default: "1.2"
      voice:
        description: "kokoro (free voice matched to yours), clone (your own voice, slow) or edge (Microsoft voices, often blocked)"
        default: "kokoro"
      upload:
        description: "Upload to the Call of Yuki YouTube channel? (true/false)"
        default: "false"
      privacy:
        description: "YouTube visibility: private, unlisted or public"
        default: "private"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SCRIPT: ${{ github.event.inputs.script }}
      MODE: ${{ github.event.inputs.mode }}
      VOICE: ${{ github.event.inputs.voice }}
      ENERGY: ${{ github.event.inputs.energy }}
      UPLOAD: ${{ github.event.inputs.upload }}
      PRIVACY: ${{ github.event.inputs.privacy }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          [[ "$SCRIPT" =~ ^stories/[A-Za-z0-9._-]+\.txt$ ]] || { echo "::error::script must look like stories/name.txt"; exit 1; }
          [[ "$MODE" == "explainer" || "$MODE" == "story" ]] || { echo "::error::mode must be explainer or story"; exit 1; }
          [[ "$VOICE" == "kokoro" || "$VOICE" == "clone" || "$VOICE" == "edge" ]] || { echo "::error::voice must be kokoro, clone or edge"; exit 1; }
          [[ "$ENERGY" =~ ^[0-2](\.[0-9]+)?$ ]] || ENERGY=1.2
          echo "ENERGY=$ENERGY" >> "$GITHUB_ENV"
          [[ "$PRIVACY" == "private" || "$PRIVACY" == "unlisted" || "$PRIVACY" == "public" ]] || { echo "::error::bad privacy"; exit 1; }
          test -f "$SCRIPT" || { echo "::error::$SCRIPT not found"; exit 1; }
          if [ "$VOICE" = "clone" ]; then ls voice/ref.* >/dev/null 2>&1 || { echo "::error::No voice sample. Add voice/ref.m4a (or .wav/.mp3), 10-30 seconds of your clean voice, or pick the edge voice."; exit 1; }; fi

      - name: System dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/mono-official-stable.list
          for i in 1 2 3; do
            sudo apt-get update -y -o Acquire::Retries=3 || true
            sudo apt-get install -y ffmpeg espeak-ng && break
            echo "apt attempt $i failed, retrying..."; sleep 10
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install the Kokoro voice
        if: ${{ github.event.inputs.voice == 'kokoro' }}
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" "kokoro>=0.9.4" soundfile

      - name: Cache Kokoro model files
        if: ${{ github.event.inputs.voice == 'kokoro' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1

      - name: Install the voice-cloning model (clone only)
        if: ${{ github.event.inputs.voice == 'clone' }}
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts

      - name: Cache voice model files
        if: ${{ github.event.inputs.voice == 'clone' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1

      - name: Cache finished sentences (so a re-run does not start over)
        if: ${{ github.event.inputs.voice == 'clone' }}
        uses: actions/cache@v4
        with:
          path: .work
          key: clone-sentences-${{ github.run_id }}
          restore-keys: clone-sentences-

      - name: Render
        run: |
          mkdir -p output
          name=$(basename "${SCRIPT%.txt}")
          if [ "$VOICE" = "clone" ]; then
            src=$(ls voice/ref.* | head -1)
            ffmpeg -y -v error -i "$src" -t 30 -ar 24000 -ac 1 "$RUNNER_TEMP/ref.wav"
            python -u generate.py "$SCRIPT" --mode "$MODE" --tts clone --ref "$RUNNER_TEMP/ref.wav" --energy "$ENERGY" --out "output/$name.mp4"
          else
            python -u generate.py "$SCRIPT" --mode "$MODE" --tts "$VOICE" --energy "$ENERGY" --out "output/$name.mp4"
          fi
          ls -la output

      - name: Make the thumbnail
        continue-on-error: true
        run: |
          name=$(basename "${SCRIPT%.txt}")
          python -u make_thumbnail.py "$SCRIPT" --mode "$MODE" --out "output/$name.jpg"

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output/*.mp4
            output/*.srt
            output/*.jpg

      - name: Upload to YouTube
        if: ${{ github.event.inputs.upload == 'true' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          name=$(basename "${SCRIPT%.txt}")
          mkdir -p results
          THUMBNAIL="output/$name.jpg" RESULT_JSON="results/$name.json" python -u publish_youtube.py "output/$name.mp4" "$SCRIPT"

      - name: Save the result link
        if: ${{ github.event.inputs.upload == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "Video published [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
